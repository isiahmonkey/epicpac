<!doctype html><html><head><style>html,body{margin:0;background:#000}</style></head><body><canvas id=c></canvas>
<script>
// Minimal WebGL2 PBR renderer for STAGING previews (no external libs): GLB -> GGX/metal-rough, normal maps,
// key-light shadow map, 4-light studio rig, skin wrap/scatter, alpha mask/blend, emissive pass, ACES.
const Q=new URLSearchParams(location.search); const W=+Q.get('w')||900,H=+Q.get('h')||1100;
const cv=document.getElementById('c'); cv.width=W; cv.height=H;
const gl=cv.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true}); gl.getExtension('EXT_color_buffer_float');
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
function prog(v,f){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);return p}
const VS=`#version 300 es
layout(location=0) in vec3 P; layout(location=1) in vec3 N; layout(location=2) in vec2 UV;
uniform mat4 VP; uniform mat4 LVP; out vec3 wp; out vec3 wn; out vec2 uv; out vec4 lp;
void main(){wp=P;wn=N;uv=UV;lp=LVP*vec4(P,1.);gl_Position=VP*vec4(P,1.);}`;
const FS=`#version 300 es
precision highp float; in vec3 wp; in vec3 wn; in vec2 uv; in vec4 lp; out vec4 o;
uniform sampler2D tB,tN,tMR,tE,tS; uniform vec4 base; uniform float metal,rough,nsc,emisF,cutoff,skin,clearc,shmin,selfl,nospec;
uniform int hasB,hasN,hasMR,hasE,mode,emitOnly,dbg; uniform vec3 cam; uniform vec3 Ld[4]; uniform vec3 Lc[4];
vec3 lin(vec3 c){return pow(c,vec3(2.2));}
float shadow(){vec3 s=lp.xyz/lp.w*.5+.5; if(s.x<0.||s.x>1.||s.y<0.||s.y>1.)return 1.; float r=0.; vec2 ts=1./vec2(textureSize(tS,0));
 for(int x=-2;x<=2;x++)for(int y=-2;y<=2;y++){r+= (s.z-0.0015 > texture(tS,s.xy+vec2(x,y)*ts).r)?0.:1.;} return r/25.;}
mat3 tbn(vec3 n){vec3 dp1=dFdx(wp),dp2=dFdy(wp);vec2 du1=dFdx(uv),du2=dFdy(uv);vec3 dp2p=cross(dp2,n),dp1p=cross(n,dp1);
 vec3 t=dp2p*du1.x+dp1p*du2.x; vec3 b=dp2p*du1.y+dp1p*du2.y; float k=inversesqrt(max(dot(t,t),dot(b,b))+1e-20); return mat3(t*k,b*k,n);}
void main(){
 vec4 bc=base; if(hasB==1){vec4 t=texture(tB,uv); bc*=vec4(lin(t.rgb),t.a);}
 if(mode==1 && bc.a<cutoff) discard;
 vec3 e=vec3(0); if(hasE==1) e=lin(texture(tE,uv).rgb)*emisF;
 if(emitOnly==1){o=vec4(e*(mode==2?bc.a:1.),1.);return;}
 if(dbg==1){o=vec4(bc.rgb,1.);return;}
 vec3 n=normalize(wn); if(dot(n,cam-wp)<0.) n=-n;   // face the viewer (some CP meshes are wound inward)
 if(hasN==1){vec3 t=texture(tN,uv).xyz*2.-1.; t.xy*=nsc; n=normalize(tbn(n)*t);}
 float m=metal,r=rough; if(hasMR==1){vec4 t=texture(tMR,uv); r*=t.g; m*=t.b;}
 r=clamp(r,0.04,1.); vec3 v=normalize(cam-wp); vec3 f0=mix(vec3(skin>0.?.022:.04),bc.rgb,m); vec3 dif=bc.rgb*(1.-m);
 vec3 col=vec3(0); float sd=shadow();
 for(int i=0;i<4;i++){ vec3 l=normalize(Ld[i]); vec3 h=normalize(l+v); float nl=dot(n,l);
   float w = skin>0. ? max((nl+0.25)/1.25,0.) : max(nl,0.);       // wrap lighting = cheap subsurface
   float nlc=max(nl,0.), nh=max(dot(n,h),0.), nv=max(dot(n,v),1e-3), vh=max(dot(v,h),0.);
   float a=r*r, a2=a*a, d=(nh*nh*(a2-1.)+1.); float D=a2/(3.14159*d*d); float k=(r+1.)*(r+1.)/8.;
   float G=nlc/(nlc*(1.-k)+k)*nv/(nv*(1.-k)+k); vec3 F=f0+(1.-f0)*pow(1.-vh,5.);
   vec3 spec=D*G*F/max(4.*nlc*nv,1e-3);
   float s= i==0 ? mix(shmin,1.,sd) : 1.;
   vec3 sss = skin>0. ? vec3(0.22,0.07,0.035)*skin*max(0.,0.4-abs(nl))*s : vec3(0);   // red terminator scatter
   col+=Lc[i]*s*((dif/3.14159)*w*3.14159*0.32 + (1.-nospec)*spec*nlc + dif*sss);
   if(clearc>0.){float a2c=0.0009; float dc=(nh*nh*(a2c-1.)+1.); col+=Lc[i]*s*clearc*0.04*a2c/(3.14159*dc*dc)*nlc*0.25;}
 }
 // environment: hemisphere ambient + glossy sky reflection
 vec3 R=reflect(-v,n); float up=n.y*.5+.5; vec3 amb=mix(vec3(.010,.010,.012),vec3(.05,.05,.055),up);
 vec3 envS=mix(vec3(.01+.10*m),vec3(.35,.36,.40)*(1.+2.2*m),smoothstep(-.2,.9,R.y))*(1.-r*0.6)*(1.-r*0.6);   // metals: brighter studio softbox so coloured metal reads
 vec3 Fv=f0+(max(vec3(1.-r),f0)-f0)*pow(1.-max(dot(n,v),0.),5.);
 col+=bc.rgb*selfl + dif*amb*3.0 + (1.-nospec)*envS*Fv*1.4 + e;
 o=vec4(col, mode==2?bc.a:1.);
}`;
const SVS=`#version 300 es
layout(location=0) in vec3 P; layout(location=2) in vec2 UV; uniform mat4 LVP; out vec2 uv; void main(){uv=UV;gl_Position=LVP*vec4(P,1.);}`;
const SFS=`#version 300 es
precision highp float; in vec2 uv; uniform sampler2D tB; uniform int mode; uniform float cutoff; out vec4 o;
void main(){ if(mode!=0 && texture(tB,uv).a<max(cutoff,0.3)) discard; o=vec4(gl_FragCoord.z);}`;
const TVS=`#version 300 es
out vec2 uv; void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2); uv=p; gl_Position=vec4(p*2.-1.,0,1);}`;
const TFS=`#version 300 es
precision highp float; in vec2 uv; uniform sampler2D tC; uniform float exposure; out vec4 o;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){vec3 c=texture(tC,uv).rgb*exposure; o=vec4(pow(aces(c),vec3(1./2.2)),1.);}`;
const P0=prog(VS,FS),PS=prog(SVS,SFS),PT=prog(TVS,TFS);
// ---- math
function persp(f,a,n,fa){const t=1/Math.tan(f/2);return [t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0]}
function ortho(l,r,b,t,n,f){return [2/(r-l),0,0,0,0,2/(t-b),0,0,0,0,-2/(f-n),0,-(r+l)/(r-l),-(t+b)/(t-b),-(f+n)/(f-n),1]}
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]} function cr(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function nrm(a){const l=Math.hypot(...a);return a.map(x=>x/l)} function dt(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function look(e,c,u){const z=nrm(sub(e,c)),x=nrm(cr(u,z)),y=cr(z,x);return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dt(x,e),-dt(y,e),-dt(z,e),1]}
function mul(a,b){const o=new Array(16).fill(0);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o}
// ---- GLB
async function loadGLB(url){
 const ab=await (await fetch(url)).arrayBuffer(); const dv=new DataView(ab); const jl=dv.getUint32(12,true);
 const J=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,20,jl))); const bo=20+jl+8;
 const view=i=>{const v=J.bufferViews[i];return new Uint8Array(ab,bo+(v.byteOffset||0),v.byteLength)};
 const acc=i=>{const a=J.accessors[i];const v=J.bufferViews[a.bufferView];const n={VEC3:3,VEC2:2,SCALAR:1}[a.type]*a.count;
   const off=bo+(v.byteOffset||0)+(a.byteOffset||0); return a.componentType===5126?new Float32Array(ab.slice(off,off+n*4)):new Uint32Array(ab.slice(off,off+n*4))};
 const texs=await Promise.all(J.textures.map(async t=>{const im=J.images[t.source]; const bmp=await createImageBitmap(new Blob([view(im.bufferView)],{type:im.mimeType}),{imageOrientation:'none',premultiplyAlpha:'none',colorSpaceConversion:'none'});
   const tx=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tx); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bmp); gl.generateMipmap(gl.TEXTURE_2D);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
   const an=gl.getExtension('EXT_texture_filter_anisotropic'); if(an) gl.texParameterf(gl.TEXTURE_2D,an.TEXTURE_MAX_ANISOTROPY_EXT,8); return tx}));
 const out=[]; const lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];
 J.nodes.forEach(nd=>{const me=J.meshes[nd.mesh]; me.primitives.forEach(pr=>{
   const P=acc(pr.attributes.POSITION),N=acc(pr.attributes.NORMAL),T=acc(pr.attributes.TEXCOORD_0),I=acc(pr.indices);
   for(let i=0;i<P.length;i+=3)for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],P[i+k]);hi[k]=Math.max(hi[k],P[i+k])}
   const va=gl.createVertexArray(); gl.bindVertexArray(va);
   [[P,0,3],[N,1,3],[T,2,2]].forEach(([d,l,s])=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,d,gl.STATIC_DRAW);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,s,gl.FLOAT,false,0,0)});
   const ib=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,I,gl.STATIC_DRAW);
   const m=J.materials[pr.material], pb=m.pbrMetallicRoughness||{}, ex=m.extras||{};
   let cx=0,cy=0,cz=0; for(let i=0;i<P.length;i+=3){cx+=P[i];cy+=P[i+1];cz+=P[i+2]} const n3=P.length/3;
   out.push({name:me.name,va,n:I.length,c:[cx/n3,cy/n3,cz/n3],mode:m.alphaMode==='MASK'?1:m.alphaMode==='BLEND'?2:0,cutoff:m.alphaCutoff||0.5,double:!!m.doubleSided,
     base:pb.baseColorFactor||[1,1,1,1],metal:pb.metallicFactor??1,rough:pb.roughnessFactor??1,tB:pb.baseColorTexture?texs[pb.baseColorTexture.index]:null,
     tN:m.normalTexture?texs[m.normalTexture.index]:null,nsc:m.normalTexture?(m.normalTexture.scale??1):1,tMR:pb.metallicRoughnessTexture?texs[pb.metallicRoughnessTexture.index]:null,
     tE:m.emissiveTexture?texs[m.emissiveTexture.index]:null,emisF:(m.emissiveFactor||[0])[0],skin:ex.skin||0,clearc:ex.clearcoat||0,order:ex.order||0,shmin:ex.shmin||0,selfl:ex.selflit||0,nospec:ex.nospec||0});
 })}); return {meshes:out,lo,hi};
}
(async()=>{try{
 const S=await loadGLB(Q.get('f'));
 const t=JSON.parse(Q.get('t')||'null')||[(S.lo[0]+S.hi[0])/2,(S.lo[1]+S.hi[1])/2,(S.lo[2]+S.hi[2])/2];
 const yaw=(+Q.get('yaw')||0)*Math.PI/180, el=(+Q.get('el')||0)*Math.PI/180, d=+Q.get('d')||1.0, fov=(+Q.get('fov')||24)*Math.PI/180;
 const cam=[t[0]+Math.sin(yaw)*Math.cos(el)*d, t[1]+Math.sin(el)*d, t[2]-Math.cos(yaw)*Math.cos(el)*d];
 const VP=mul(persp(fov,W/H,0.01,20),look(cam,t,[0,1,0]));
 // lights in a camera-relative studio rig (key upper-left-front, cool fill right, two back rims)
 const rot=(x,y,z)=>{const c=Math.cos(yaw),s=Math.sin(yaw);return [x*c+z*s,y,-x*s+z*c]};
 const L=[rot(-1.2,1.5,-2.0),rot(1.7,0.4,-1.3),rot(-1.6,1.1,2.0),rot(1.7,0.9,1.8)];
 const LC=[[3.2,3.0,2.75],[0.55,0.62,0.75],[2.2,2.2,2.3],[1.9,1.75,1.6]].map(c=>c.map(x=>x*(+Q.get('li')||1)));
 // shadow map from key light
 const SM=2048, st=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,st); gl.texImage2D(gl.TEXTURE_2D,0,gl.R32F,SM,SM,0,gl.RED,gl.FLOAT,null);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
 const sdb=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,sdb); gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,SM,SM);
 const sfb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,sfb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,st,0); gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,sdb);
 const ld=nrm(L[0]); const ext=Math.max(S.hi[0]-S.lo[0],S.hi[1]-S.lo[1],S.hi[2]-S.lo[2])*0.75; const lc=[t[0]+ld[0]*3,t[1]+ld[1]*3,t[2]+ld[2]*3];
 const LVP=mul(ortho(-ext,ext,-ext,ext,0.5,6),look(lc,t,[0,1,0]));
 gl.viewport(0,0,SM,SM); gl.clearColor(1,1,1,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
 gl.useProgram(PS); gl.uniformMatrix4fv(gl.getUniformLocation(PS,'LVP'),false,LVP);
 for(const m of S.meshes){ if(m.mode===2) continue; gl.uniform1i(gl.getUniformLocation(PS,'mode'),m.mode); gl.uniform1f(gl.getUniformLocation(PS,'cutoff'),m.cutoff);
   gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,m.tB); gl.uniform1i(gl.getUniformLocation(PS,'tB'),0); gl.bindVertexArray(m.va); gl.drawElements(gl.TRIANGLES,m.n,gl.UNSIGNED_INT,0);}
 // HDR target (MSAA via renderbuffer + blit)
 const hdr=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,hdr); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,W,H,0,gl.RGBA,gl.HALF_FLOAT,null); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 const hfb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,hfb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,hdr,0);
 const msc=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,msc); gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,gl.RGBA16F,W,H);
 const msd=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,msd); gl.renderbufferStorageMultisample(gl.RENDERBUFFER,4,gl.DEPTH_COMPONENT24,W,H);
 const mfb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,mfb); gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,msc); gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,msd);
 function scene(emitOnly){
  gl.bindFramebuffer(gl.FRAMEBUFFER,mfb); gl.viewport(0,0,W,H); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(P0); const U=n=>gl.getUniformLocation(P0,n);
  gl.uniformMatrix4fv(U('VP'),false,VP); gl.uniformMatrix4fv(U('LVP'),false,LVP); gl.uniform3fv(U('cam'),cam); gl.uniform3fv(U('Ld'),L.flat()); gl.uniform3fv(U('Lc'),LC.flat()); gl.uniform1i(U('emitOnly'),emitOnly); gl.uniform1i(U('dbg'),+Q.get('dbg')||0);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D,st); gl.uniform1i(U('tS'),4);
  const opaque=S.meshes.filter(m=>m.mode!==2), blend=S.meshes.filter(m=>m.mode===2).sort((a,b)=>(a.order-b.order)||(Math.hypot(...sub(b.c,cam))-Math.hypot(...sub(a.c,cam))));
  for(const m of [...opaque,...blend]){
   if(m.mode===2){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);} else {gl.disable(gl.BLEND);gl.depthMask(true);}
   if(emitOnly&&m.mode===2){gl.disable(gl.BLEND);} 
   gl.uniform4fv(U('base'),m.base); gl.uniform1f(U('metal'),m.metal); gl.uniform1f(U('rough'),m.rough); gl.uniform1f(U('nsc'),m.nsc); gl.uniform1f(U('emisF'),m.emisF);
   gl.uniform1f(U('cutoff'),m.cutoff); gl.uniform1f(U('skin'),m.skin); gl.uniform1f(U('clearc'),m.clearc); gl.uniform1f(U('shmin'),m.shmin); gl.uniform1f(U('selfl'),m.selfl); gl.uniform1f(U('nospec'),m.nospec); gl.uniform1i(U('mode'),m.mode);
   [['tB',m.tB,0,'hasB'],['tN',m.tN,1,'hasN'],['tMR',m.tMR,2,'hasMR'],['tE',m.tE,3,'hasE']].forEach(([n,t,u,h])=>{gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(U(n),u);gl.uniform1i(U(h),t?1:0)});
   if(emitOnly && !m.tE && m.mode===2) continue;
   gl.bindVertexArray(m.va); gl.drawElements(gl.TRIANGLES,m.n,gl.UNSIGNED_INT,0);
  }
  gl.depthMask(true); gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,mfb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,hfb); gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H); gl.useProgram(PT); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,hdr);
  gl.uniform1i(gl.getUniformLocation(PT,'tC'),0); gl.uniform1f(gl.getUniformLocation(PT,'exposure'),emitOnly?1.0:(+Q.get('exp')||1.0)); gl.drawArrays(gl.TRIANGLES,0,3);
 }
 scene(+Q.get('emit')||0); document.title='done';
}catch(e){document.title='err '+e}})();
</script></body></html>
